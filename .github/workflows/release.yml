name: Release

on:
  push:
    tags:
      - "u18n-cli-v[0-9]+.*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag Name'
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: taiki-e/create-gh-release-action@v1
        with:
          prefix: u18n-cli-
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: u18n-cli
          package: u18n-cli
          target: ${{ matrix.target }}
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          locked: true
          tar: unix
          zip: windows
