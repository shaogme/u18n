[package]
name = "u18n-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line tools for compiling u18n catalogs, extracting translator context, and reporting coverage."
documentation = "https://docs.rs/u18n-cli"
keywords = ["i18n", "localization", "cli", "translation", "compiler"]
categories = ["internationalization", "localization", "command-line-utilities"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-fmt = "zip"

[dependencies]
u18n-compiler = { workspace = true }

[lints]
workspace = true
